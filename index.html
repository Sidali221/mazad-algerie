<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزاد الجزائر | DZ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#69758a;--green:#087f5b;--green2:#0ca678;--line:#e5eaf1;--gold:#f59f00}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#102b24;color:#fff;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:900}
.brand span{color:#63e6be}
.tag{font-size:12px;color:#c8f7e7;margin-top:4px}
.headerbtn,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.headerbtn{background:#fff;color:#102b24}
.hero{background:linear-gradient(120deg,#103c30,#087f5b);color:white;padding:36px 20px}
.hero-inner{max-width:1120px;margin:auto}
.hero h1{font-size:clamp(27px,5vw,42px);margin:0 0 12px}
.hero p{line-height:1.9;color:#e0fff4;max-width:680px}
.searchrow{display:flex;gap:10px;max-width:680px;margin-top:20px}
.searchrow input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px;font-size:15px}
.btn{background:var(--green2);color:white}
.wrap{max-width:1120px;margin:28px auto;padding:0 18px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.heading h2{margin:0;font-size:24px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{background:white;border:1px solid var(--line);border-radius:99px;padding:9px 14px;cursor:pointer}
.filter.active{background:#d3f9e8;border-color:#63e6be;color:#075c43}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px
